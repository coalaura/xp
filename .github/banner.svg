<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="289" viewBox="0 0 1068 289" fill="none" role="img" aria-labelledby="title description">
	<title id="title">xp</title>
	<desc id="description">A wide Windows XP Luna window containing white xp lettering over a recreated Bliss landscape.</desc>
	<defs>
		<clipPath id="landscape">
			<rect x="32" y="20" width="1056" height="238"/>
		</clipPath>
		<linearGradient id="sky" x1="560" y1="20" x2="560" y2="258" gradientUnits="userSpaceOnUse">
			<stop stop-color="#155fc4"/>
			<stop offset="0.55" stop-color="#479be1"/>
			<stop offset="1" stop-color="#b3ddf4"/>
		</linearGradient>
		<linearGradient id="hill" x1="620" y1="145" x2="654" y2="280" gradientUnits="userSpaceOnUse">
			<stop stop-color="#a1c943"/>
			<stop offset="0.25" stop-color="#7fb32f"/>
			<stop offset="0.65" stop-color="#528f23"/>
			<stop offset="1" stop-color="#266525"/>
		</linearGradient>
		<linearGradient id="sunlit-slope" x1="710" y1="150" x2="698" y2="248" gradientUnits="userSpaceOnUse">
			<stop stop-color="#c8df64" stop-opacity="0.58"/>
			<stop offset="1" stop-color="#b0d248" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
			<stop stop-color="#ffffff"/>
			<stop offset="1" stop-color="#dcecf9" stop-opacity="0.65"/>
		</linearGradient>
		<filter id="soft-cloud" x="-10%" y="-30%" width="120%" height="160%">
			<feGaussianBlur stdDeviation="1.3"/>
		</filter>
		<!-- Outlined lettering keeps the main mark independent of installed fonts. -->
		<path id="xp" fill-rule="evenodd" d="M0 0H32L52 30L73 0H106L69 48L108 99H74L52 66L30 99H-4L34 48ZM121 0H151V12C160 2 173-3 188-3C220-3 242 18 242 49C242 81 220 102 190 102C174 102 162 97 153 87V137H121ZM153 49C153 66 164 77 180 77C197 77 208 66 208 49C208 32 197 22 180 22C164 22 153 33 153 49Z"/>
	</defs>
	<!-- Lossless theme.Draw output: NewLayout(1068, 289, 144, false), State{Active: true}. -->
	<!-- Transparent client area; top corners use window.updateRegion's Win32 region mask. -->
	<image id="window-frame" width="1068" height="289" href="data:image/webp;base64,"/>
	<g transform="translate(-26 25)" clip-path="url(#landscape)">
		<rect x="32" y="20" width="1056" height="238" fill="url(#sky)"/>
		<g id="clouds" fill="url(#cloud)" filter="url(#soft-cloud)">
			<path d="M749 69C766 64 773 66 784 65C780 57 791 51 803 53C805 37 823 31 837 40C849 25 875 29 884 45C900 38 922 43 926 56C944 51 958 57 958 64C977 63 995 67 1008 73C948 78 899 72 858 76C817 80 780 77 749 69Z" opacity="0.94"/>
			<path d="M451 111C468 106 484 107 495 104C493 95 505 91 516 94C518 82 535 78 546 86C559 79 578 85 579 97C595 94 607 100 611 104C629 103 645 107 657 112C609 116 583 112 556 115C520 119 484 116 451 111Z" opacity="0.8"/>
			<path d="M913 117C931 111 955 114 969 109C983 101 1006 101 1016 109C1033 103 1055 108 1060 114C1074 113 1085 116 1097 120C1038 124 972 125 913 117Z" opacity="0.66"/>
		</g>
		<path d="M32 83C96 65 166 56 235 60C169 62 102 74 32 91Z" fill="#d8ecff" opacity="0.16"/>
		<path d="M670 236C775 212 849 186 937 187C1008 187 1059 202 1088 207V258H670Z" fill="#578b7f"/>
		<path d="M782 233C891 198 979 208 1088 223V258H782Z" fill="#5b8043"/>
		<path d="M32 232C186 250 312 214 452 175C593 136 681 135 779 158C895 184 985 224 1088 229V258H32Z" fill="url(#hill)"/>
		<path d="M32 232C186 250 312 214 452 175C593 136 681 135 779 158C895 184 985 224 1088 229C926 225 826 186 701 180C493 170 365 253 32 252Z" fill="url(#sunlit-slope)"/>
		<path d="M32 252C209 268 360 230 517 217C673 204 795 217 922 247C762 227 657 231 532 241C358 255 216 284 32 272Z" fill="#2b7028" opacity="0.22"/>
		<g transform="translate(100 67)">
			<use href="#xp" y="3" fill="#174d8c" opacity="0.32"/>
			<use href="#xp" fill="#fffdf5"/>
		</g>
	</g>
</svg>
